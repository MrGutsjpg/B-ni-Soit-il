<link rel="stylesheet" href="/B-ni-Soit-il/_astro/dashboard.BI8qqQLo.css"></head> <body class="min-h-screen">  <main class="container mx-auto py-12 max-w-md"> <h1 class="font-serif text-2xl text-primary mb-4">Admin — Login (Supabase)</h1> <p class="mb-4 text-sm text-gray-700">Entre com email. Você receberá um magic link por e-mail.</p> <form id="loginForm" class="space-y-3"> <div><label class="block text-sm">Email</label><input id="email" name="email" type="email" class="w-full border px-3 py-2 rounded" required></div> <div><button class="btn-primary">Enviar magic link</button></div> <div id="msg" class="text-sm text-green-600 hidden"></div> </form> <script type="module">
      import { supabase } from '/src/lib/supabaseClient.js';
      const form = document.getElementById('loginForm');
      const msg = document.getElementById('msg');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const { error } = await supabase.auth.signInWithOtp({ email });
        if (error) {
          msg.textContent = error.message; msg.classList.remove('text-green-600'); msg.classList.add('text-red-600'); msg.classList.remove('hidden');
        } else {
          msg.textContent = 'Magic link enviado. Verifique seu e-mail.'; msg.classList.remove('hidden');
        }
      });
    </script> </main>  </body></html>
