<!DOCTYPE html><html lang="pt-BR"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Béni Soit-Il — Padaria e Confeitaria</title><meta name="description" content="Béni Soit-Il — padaria e confeitaria artesanal inspirada na França. Croissants, éclairs, tartes e encomendas."><meta property="og:title" content="Béni Soit-Il — Padaria e Confeitaria"><meta property="og:description" content="Arte francesa em cada detalhe — Croissants, éclairs, tartes e encomendas."><meta property="og:image" content="/B-ni-Soit-il/images/placeholder.svg"><link rel="icon" href="/B-ni-Soit-il/favicon.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/B-ni-Soit-il/_astro/dashboard.DbNfEtxe.css">
<link rel="stylesheet" href="/B-ni-Soit-il/_astro/dashboard.SnmCdzms.css"></head> <body class="min-h-screen"> <div class="page-frame">  <header class="container mx-auto flex flex-col gap-4 py-6 md:flex-row md:items-center md:justify-between"> <div class="site-brand">Béni Soit-Il</div> <nav class="site-nav"> <a href="#destaques">Destaques</a> <a href="#sobre">Sobre</a> <a href="#galeria">Galeria</a> <a href="#contato">Contato</a> <a href="/B-ni-Soit-il/admin/supabase-login" class="btn-primary">Login ADM</a> </nav> </header> <main class="py-12 container mx-auto"> <div class="max-w-2xl mx-auto"> <div class="card-border p-6 rounded-md bg-white"> <h2 class="font-serif text-xl text-primary mb-4">Fazer encomenda</h2> <form id="orderForm" class="space-y-4"> <div> <label class="block text-sm font-medium">Nome</label> <input name="name" required class="w-full border px-3 py-2 rounded-md"> </div> <div> <label class="block text-sm font-medium">Contato (WhatsApp)</label> <input name="contact" required class="w-full border px-3 py-2 rounded-md"> </div> <div> <label class="block text-sm font-medium">Produto</label> <input id="productInput" name="product" class="w-full border px-3 py-2 rounded-md"> </div> <div> <label class="block text-sm font-medium">Quantidade</label> <input name="quantity" type="number" min="1" value="1" class="w-32 border px-3 py-2 rounded-md"> </div> <div> <label class="block text-sm font-medium">Data desejada</label> <input name="date" type="date" class="w-48 border px-3 py-2 rounded-md"> </div> <div> <label class="block text-sm font-medium">Observações</label> <textarea name="notes" rows="3" class="w-full border px-3 py-2 rounded-md"></textarea> </div> <div class="pt-2"> <button type="submit" class="btn-primary">Enviar encomenda</button> </div> <div id="orderMessage" class="text-sm text-green-600 mt-2 hidden">Encomenda enviada (placeholder).</div> </form> <script type="module">
    (function(){
      const form = document.getElementById('orderForm');
      const msg = document.getElementById('orderMessage');
      // prefill product from query param
      const params = new URLSearchParams(location.search);
      const product = params.get('product');
      if (product) document.getElementById('productInput').value = product;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = new FormData(form);
        const payload = Object.fromEntries(data.entries());
        // try to store in Supabase orders table if available, otherwise fallback to local endpoint
        try {
          await fetch('/api/orders', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
        } catch (e) {
          console.warn('Falha ao gravar order localmente', e);
        }

        // abrir WhatsApp com mensagem predefinida para o número da loja
        const phone = '5543991788577';
        const message = `Olá, gostaria de fazer uma encomenda:\nNome: ${payload.name}\nContato: ${payload.contact}\nProduto: ${payload.product}\nQuantidade: ${payload.quantity}\nData: ${payload.date}\nObservações: ${payload.notes}`;
        const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');

        msg.classList.remove('hidden');
        form.reset();
      });
    })();
  </script> </div> </div> </main>  </div> </body></html>
